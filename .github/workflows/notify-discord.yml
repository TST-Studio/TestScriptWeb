name: Notify Discord

on:
  push:
  pull_request:
    types: [opened, reopened, ready_for_review, closed, converted_to_draft, edited, synchronize]
  release:
    types: [published]
  issues:
    types: [opened, closed, reopened, edited]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord (push)
        if: ${{ github.event_name == 'push' }}
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK;
            if (webhook) {
              core.info('yo yo yo webhook is defined')
            } else {
              core.warning("oh no no non Webhook is not defined");
            }
            const p = context.payload;
            const repo = p.repository.full_name;
            const branch = (p.ref || '').replace('refs/heads/', '');
            const total = (p.commits || []).length;
            const commits = (p.commits || []).slice(0, 5).map(c =>
              `• [\`${c.id.substring(0,7)}\`](${c.url}) ${c.message.split('\n')[0]} — ${c.author.name}`
            ).join('\n');
            const more = total > 5 ? `... and ${total - 5} more` : '';
            const compareUrl = p.compare;
            const content = [
              `**${repo}**`,
              `**${p.pusher?.name || 'Someone'}** pushed to **${branch}** (${total} commit${total===1?'':'s'})`,
              commits,
              more,
              `[Compare changes](${compareUrl})`
            ].filter(Boolean).join('\n');

            await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ content })
            });

      - name: Post to Discord (pull_request)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK;

            const pr = context.payload.pull_request;
            const action = context.payload.action;
            const repo = context.payload.repository.full_name;
            const title = pr.title;
            const number = pr.number;
            const url = pr.html_url;
            const user = pr.user?.login;
            const base = pr.base?.ref;
            const head = pr.head?.ref;
            const merged = pr.merged ? ' (merged)' : '';
            const content = `**${repo}**\nPR #${number} ${merged} **${title}**\n${action} by **${user}** — \`${head}\` → \`${base}\`\n${url}`;

            await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ content })
            });

      - name: Post to Discord (release)
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK;
            const r = context.payload.release;
            const repo = context.payload.repository.full_name;
            const content = `**${repo}**\nNew release **${r.name || r.tag_name}** published by **${r.author?.login}**\n${r.html_url}`;
            await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ content })
            });

      - name: Post to Discord (issues)
        if: ${{ github.event_name == 'issues' }}
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK;
            const i = context.payload.issue;
            const action = context.payload.action;
            const repo = context.payload.repository.full_name;
            const title = i.title;
            const number = i.number;
            const url = i.html_url;
            const user = context.payload.sender?.login;
            const content = `**${repo}**\nIssue #${number} **${title}**\n${action} by **${user}**\n${url}`;
            await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ content })
            });

